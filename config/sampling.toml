# Poly-Cleaner Configuration File
# Adaptive Sampling Parameters

[sampling]
# Base sampling interval (hours)
base_interval_hours = 1

# Sampling interval limits
min_interval_minutes = 1
max_interval_hours = 24

# Volatility thresholds
high_volatility_threshold = 0.02    # High volatility: 1-5min sampling
medium_volatility_threshold = 0.005 # Medium volatility: 15-30min sampling
low_volatility_threshold = 0.001    # Low volatility: 1-6h sampling

# Rate of change thresholds
velocity_threshold_per_hour = 0.01
acceleration_threshold_per_hour_squared = 0.005

# Change point detection
change_point_detection_window_size = 24
change_point_confidence_level = 0.95
change_point_min_samples = 12

# Sampling strategy
volatility_multiplier = 10.0
decay_factor = 0.9
stable_period_hours = 2

[api]
# API endpoints
gamma_api_base_url = "https://gamma-api.polymarket.com"
clob_api_base_url = "https://clob.polymarket.com"

# Request configuration
max_retries = 3
timeout_seconds = 30
rate_limit_per_minute = 60

# Concurrency configuration
max_concurrent_requests = 16

[database]
# Database configuration
url = "sqlite:///data/polymarket.db"
wal_mode = true
cache_size_mb = 64

[markets]
# Market filtering
min_volume = 1000
max_markets = 1000
# Max search results for market search
max_search_results = 50
# Max pages to scan during search (100 markets per page, 20 pages=2000, 50 pages=5000)
max_scan_pages = 20
categories = ["politics", "economics", "sports", "crypto"]

[logging]
level = "info"
file = "logs/polymarket.log"
max_file_size_mb = 100
